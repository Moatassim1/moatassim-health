# Turns the free Z-Anatomy model (CC BY-SA 4.0, based on BodyParts3D) into a light 3D muscle figure for the app.
name: Anatomy model
on:
  workflow_dispatch:
    inputs:
      step:
        description: 'dump = list objects, export = build the app model'
        default: dump
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Get Blender and Z-Anatomy
        run: |
          curl -sSL https://download.blender.org/release/Blender3.6/blender-3.6.5-linux-x64.tar.xz | tar xJ
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxkbcommon0 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 >/dev/null
          git clone --depth 1 -q https://github.com/Z-Anatomy/Models-of-human-anatomy za
          cd za && unzip -q Z-Anatomy.zip && ls -la Z-Anatomy
      - name: Run
        run: |
          mkdir -p out
          if [ "${{ inputs.step }}" = "dump" ]; then
            ./blender-3.6.5-linux-x64/blender -b za/Z-Anatomy/Startup.blend --python native/anatomy/dump.py -- out/objects.json 2>&1 | tail -20
          else
            ./blender-3.6.5-linux-x64/blender -b za/Z-Anatomy/Startup.blend --python native/anatomy/export.py -- out 2>&1 | tail -60
          fi
          ls -la out
      - name: Save results
        run: |
          git config user.name "anatomy-bot"; git config user.email "bot@users.noreply.github.com"
          git checkout --orphan anatomy-out && git rm -rf -q . && cp -r out/* . && rm -rf out za blender-3.6.5-linux-x64
          git add -A && git commit -qm "anatomy ${{ inputs.step }}" && git push -f origin anatomy-out
