name: App Store check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pyjwt cryptography requests
      - env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          export SUPA_URL=$(grep -o "url: *'[^']*'" config.js | head -1 | sed "s/url: *'//;s/'//")
          export SUPA_KEY=$(grep -o "key: *'[^']*'" config.js | head -1 | sed "s/key: *'//;s/'//")
          python3 native/asc_check.py
