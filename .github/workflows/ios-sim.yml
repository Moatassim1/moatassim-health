# Runs the iPhone app in a simulator and saves screenshots (incl. a diagnostics screen) to the ci-shots branch.
name: iPhone simulator check
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sim:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true); [ -z "$X" ] && X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"; xcodebuild -version
      - name: Project
        run: |
          npm install --no-audit --no-fund
          npm run www
          npx cap add ios --packagemanager SPM || npx cap add ios
          npx cap sync ios
          bash native/setup-ios.sh | grep "::notice" || true
          echo "::notice::capacitor $(npx cap --version) · $(npm ls @capacitor/ios --depth=0 | grep ios)"
      - name: Build for simulator
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build | tail -5
      - name: Run and capture
        run: |
          set -x
          DEV=$(xcrun simctl list devices available | grep -E "iPhone 1[5-7]( Pro)? \(" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "device $DEV"
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b
          APPP=$(find "$RUNNER_TEMP/dd/Build/Products" -name "App.app" -maxdepth 3 | head -1)
          xcrun simctl install "$DEV" "$APPP"
          xcrun simctl launch --console-pty "$DEV" com.gggains.app > "$RUNNER_TEMP/console.txt" 2>&1 &
          sleep 25
          mkdir -p shots
          xcrun simctl io "$DEV" screenshot shots/1-launch.png
          xcrun simctl openurl "$DEV" "com.gggains.app://diag"
          sleep 8
          xcrun simctl io "$DEV" screenshot shots/2-diag.png
          grep -iE "plugin|error|⚡️" "$RUNNER_TEMP/console.txt" | head -40 > shots/console.txt || true
          head -c 20000 "$RUNNER_TEMP/console.txt" > shots/console-full.txt || true
      - name: Save screenshots to ci-shots branch
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-shots-tmp
          git rm -rf --cached . > /dev/null
          git add -f shots
          git commit -qm "simulator shots ${{ github.run_number }}"
          git push -f origin HEAD:ci-shots
