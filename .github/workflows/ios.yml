# Builds the GG Gains iPhone app on a Mac in the cloud and sends it to TestFlight.
# Run it from GitHub › Actions › "iPhone app" › Run workflow.
# Needs these repository secrets: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8
name: iPhone app
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Send the build to TestFlight'
        type: boolean
        default: true
      app_version:
        description: 'App version shown in the App Store (e.g. 1.1.0)'
        type: string
        default: '1.1.0'
      test_only:
        description: 'Test build only (no signing, no secrets needed)'
        type: boolean
        default: false
concurrency: ios-build
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Pick the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -z "$X" ] && X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
          echo "::notice::$(xcodebuild -version | tr '\n' ' ')"
      - name: Check secrets
        if: ${{ !inputs.test_only }}
        env:
          A: ${{ secrets.APPLE_TEAM_ID }}
          B: ${{ secrets.ASC_KEY_ID }}
          C: ${{ secrets.ASC_ISSUER_ID }}
          D: ${{ secrets.ASC_KEY_P8 }}
        run: |
          miss=""; [ -z "$A" ] && miss="$miss APPLE_TEAM_ID"; [ -z "$B" ] && miss="$miss ASC_KEY_ID"; [ -z "$C" ] && miss="$miss ASC_ISSUER_ID"; [ -z "$D" ] && miss="$miss ASC_KEY_P8"
          if [ -n "$miss" ]; then echo "::error::Missing repository secrets:$miss"; exit 1; fi
      - name: Install the app shell
        run: |
          npm install --no-audit --no-fund
          npx cap --version
          npm ls --depth=0
      - name: Web files
        run: npm run www
      - name: Create the iOS project
        run: |
          npx cap add ios --packagemanager SPM || npx cap add ios
          npx cap sync ios
          bash native/setup-ios.sh
          ls ios/App
      - name: Test build (unsigned)
        if: ${{ inputs.test_only }}
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then SRC="-workspace App.xcworkspace"; else SRC="-project App.xcodeproj"; fi
          xcodebuild $SRC -scheme App -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO TARGETED_DEVICE_FAMILY=1 build | tail -25
      - name: API key
        if: ${{ !inputs.test_only }}
        env:
          KEY: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$KEY" > ~/private_keys/AuthKey.p8
      - name: Check the Apple key works
        if: ${{ !inputs.test_only }}
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          pip3 install --quiet --break-system-packages pyjwt cryptography requests 2>/dev/null || pip3 install --quiet pyjwt cryptography requests
          python3 - <<'PY'
          import os, re, time, jwt, requests
          kid, iss, team = os.environ['KID'].strip(), os.environ['ISS'].strip(), os.environ['TEAM'].strip()
          key = open(os.path.expanduser('~/private_keys/AuthKey.p8')).read()
          probs = []
          if not re.fullmatch(r'[A-Z0-9]{10}', kid): probs.append(f'ASC_KEY_ID should be 10 capital letters/numbers (it has {len(kid)} characters{", includes AuthKey_" if "authkey" in kid.lower() else ""}{", includes .p8" if ".p8" in kid.lower() else ""})')
          if not re.fullmatch(r'[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}', iss): probs.append(f'ASC_ISSUER_ID should look like 69a6de7e-xxxx-xxxx-xxxx-xxxxxxxxxxxx (it has {len(iss)} characters)')
          if not re.fullmatch(r'[A-Z0-9]{10}', team): probs.append(f'APPLE_TEAM_ID should be 10 capital letters/numbers (it has {len(team)} characters)')
          if 'BEGIN PRIVATE KEY' not in key or 'END PRIVATE KEY' not in key: probs.append('ASC_KEY_P8 is missing the BEGIN/END PRIVATE KEY lines')
          for p in probs: print('::error::' + p)
          try:
              tok = jwt.encode({'iss': iss, 'iat': int(time.time()), 'exp': int(time.time()) + 600, 'aud': 'appstoreconnect-v1'}, key, algorithm='ES256', headers={'kid': kid, 'typ': 'JWT'})
              r = requests.get('https://api.appstoreconnect.apple.com/v1/apps?limit=5', headers={'Authorization': 'Bearer ' + tok}, timeout=30)
              print('::notice::App Store Connect answered', r.status_code)
              if r.ok:
                  apps = [(a['attributes']['name'], a['attributes']['bundleId']) for a in r.json().get('data', [])]
                  print('::notice::Apps visible to this key:', apps)
                  if not any(b == 'com.gggains.app' for _, b in apps): print('::error::No app with bundle ID com.gggains.app in App Store Connect yet')
              else:
                  print('::error::Apple rejected the key (' + str(r.status_code) + '): ' + r.text[:300].replace('\n', ' '))
          except Exception as e:
              print('::error::Could not use the key: ' + str(e)[:300])
          PY
      - name: Build (archive)
        if: ${{ !inputs.test_only }}
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then SRC="-workspace App.xcworkspace"; else SRC="-project App.xcodeproj"; fi
          xcodebuild $SRC -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="$TEAM" PRODUCT_BUNDLE_IDENTIFIER=com.gggains.app \
            TARGETED_DEVICE_FAMILY=1 MARKETING_VERSION=${{ inputs.app_version || '1.1.0' }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning: .*sign|ARCHIVE|BUILD" || true
          if [ ! -d "$RUNNER_TEMP/App.xcarchive" ]; then
            grep -E "error:|error -|No profiles|No Account|requires a provisioning|Signing" "$RUNNER_TEMP/archive.log" | sort -u | head -15 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
            tail -60 "$RUNNER_TEMP/archive.log"; exit 1
          fi
      - name: Add entitlements to the build
        if: ${{ !inputs.test_only }}
        run: |
          APPB="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          if [ -d "$APPB/Frameworks" ]; then find "$APPB/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -exec codesign --force --sign - --timestamp=none {} \; ; fi
          codesign --force --sign - --entitlements ios/App/App/App.entitlements --timestamp=none "$APPB"
          codesign -d --entitlements :- "$APPB" 2>/dev/null | grep -o 'com.apple.developer[a-z.]*' | sort -u | tr '\n' ' ' | sed 's/^/::notice::Archive entitlements: /'; echo
      - name: Sign for the App Store and send to TestFlight
        if: ${{ !inputs.test_only }}
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          set +e
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/out" -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey.p8 -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" > "$RUNNER_TEMP/export.log" 2>&1
          rc=$?; set -e
          tail -40 "$RUNNER_TEMP/export.log"
          IPA=$(ls "$RUNNER_TEMP"/out/*.ipa 2>/dev/null | head -1 || true)
          if [ -n "$IPA" ]; then mkdir -p "$RUNNER_TEMP/ipa" && cd "$RUNNER_TEMP/ipa" && unzip -q -o "$IPA" && codesign -d --entitlements :- Payload/App.app 2>/dev/null | grep -o 'com.apple.developer[a-z.]*' | sort -u | tr '\n' ' ' | sed 's/^/::notice::Uploaded app entitlements: /'; echo; cd - >/dev/null; fi
          if [ $rc -ne 0 ]; then grep -iE "error|fail" "$RUNNER_TEMP/export.log" | sort -u | head -15 | while IFS= read -r l; do echo "::error::${l:0:400}"; done; exit 1; fi
          [ -n "$IPA" ] || { echo "::error::No .ipa was produced"; exit 1; }
          cp ~/private_keys/AuthKey.p8 ~/private_keys/AuthKey_$KID.p8
          set +e
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$KID" --apiIssuer "$ISS" > "$RUNNER_TEMP/upload.log" 2>&1; urc=$?
          set -e
          tail -20 "$RUNNER_TEMP/upload.log"
          if [ $urc -ne 0 ]; then grep -iE "error|fail" "$RUNNER_TEMP/upload.log" | sort -u | head -10 | while IFS= read -r l; do echo "::error::${l:0:400}"; done; exit 1; fi
          echo "::notice::Uploaded build ${{ github.run_number }} to App Store Connect."
      - name: Clean up key
        if: always()
        run: rm -rf ~/private_keys
