    <path d="M206 210 C228 230 284 230 306 210" stroke-width="6"/>
    <path d="M256 222 L256 330" stroke-width="5"/>
    <path d="M236 262 L276 262 M238 290 L274 290 M240 316 L272 316" stroke-width="5"/>
