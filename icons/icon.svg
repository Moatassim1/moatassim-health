<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A9468"/><stop offset="1" stop-color="#11523A"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g fill="#fff">
    <!-- head tilted back -->
    <ellipse cx="258" cy="106" rx="30" ry="36" transform="rotate(-14 258 106)"/>
    <!-- neck and traps -->
    <path d="M238 128 C240 142 236 150 222 156 L196 166 C230 170 282 170 316 166 L290 156 C276 150 272 142 274 128 Z"/>
    <!-- lats flared, small waist -->
    <path d="M164 176 C200 162 312 162 348 176 C366 196 366 224 352 250 C336 280 314 306 304 344 L208 344 C198 306 176 280 160 250 C146 224 146 196 164 176 Z"/>
    <!-- delts -->
