  </g>
  <g fill="#fff">
    <!-- arms flared out, elbows bent, hands by the hips -->
    <path id="arm" d="M154 162 C112 172 88 212 86 252 C84 282 94 308 110 332 C116 342 120 352 122 362 L158 354 C152 334 142 314 138 294 C136 272 148 254 172 240 Z"/>
