<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="GG Gains">
  <meta name="theme-color" content="#F7F2EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#100C0F" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="icons/icon-180.png?v=4">
  <link rel="icon" href="icons/icon-192.png?v=4">
  <link rel="manifest" href="manifest.webmanifest">
  <title>GG Gains</title>
  <link rel="stylesheet" href="styles.css?v=2.0.32">
</head>
<body>
  <div class="auth" id="auth" hidden></div>
  <div class="boot-loading">Loading your data…</div>
  <header class="mtop" id="mtop"></header>
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <img class="brand-mark" src="icons/icon-192.png" alt="">
        <div><div class="brand-name">GG<br>Gains</div><div class="brand-ver" id="brandVer"></div></div>
      </div>
      <div class="profiles" id="profiles"></div>
      <nav class="nav" id="nav">
        <button data-view="today" class="active">Food diary</button>
        <button data-view="quests">Quests</button>
        <button data-view="trends">Daily Performance</button>
        <button data-view="friends">Ranked & friends</button>
        <button data-view="photos">Transformation</button>
        <button data-view="garmin">Devices</button>
        <button data-view="foods">Food list</button>
        <button data-view="forecast">Weight projection</button>
        <button data-view="settings">Settings</button>
      </nav>
      <button class="side-add" id="sideAdd">Log food</button>
      <div class="side-foot" id="sideFoot"></div>
    </aside>
    <main class="main" id="main"></main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Main">
    <button data-view="today" aria-label="Diary"><svg viewBox="0 0 24 24"><path class="fl" d="M3.5 10.5 12 3.5l8.5 7V20a.5.5 0 0 1-.5.5h-5v-6h-6v6H4a.5.5 0 0 1-.5-.5z"/></svg><span>Diary</span></button>
    <button data-view="quests" aria-label="Quests"><svg viewBox="0 0 24 24"><circle class="fl" cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg><span>Quests</span></button>
    <button data-view="scan" class="scan-btn" aria-label="Scan a barcode"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg><span>Scan</span></button>
    <button data-view="friends" aria-label="Ranked"><svg viewBox="0 0 24 24"><path class="fl" d="M7.5 3.5h9v6a4.5 4.5 0 0 1-9 0z"/><path d="M7.5 5.5h-3a3 3 0 0 0 3.2 4M16.5 5.5h3a3 3 0 0 1-3.2 4M12 14v3.5M8 20.5h8M9.5 17.5h5"/></svg><span>Ranked</span></button>
    <button data-view="more" aria-label="You and more"><span class="tb-av"></span><span>You</span></button>
  </nav>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" id="modalCard"></div>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script src="config.js?v=2.0.32"></script>
  <script src="foods.js?v=2.0.32"></script>
  <script src="syncmodel.js?v=2.0.32"></script>
  <script src="charts.js?v=2.0.32"></script>
  <script src="vendor/html5-qrcode.min.js" defer></script>
  <script src="scanner.js?v=2.0.32"></script>
  <script src="countries.js?v=2.0.32"></script>
  <script src="game.js?v=2.0.32"></script>
  <script src="photos.js?v=2.0.32"></script>
  <script src="api-web.js?v=2.0.32"></script>
  <script>window.MHBoot();</script>
</body>
</html>
