<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MH Health">
  <meta name="theme-color" content="#EDF1EB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1411" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Moatassim Health</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app"></div>
  <nav class="tabbar" id="tabbar" hidden>
    <button data-tab="today" class="on"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Today</span></button>
    <button data-tab="compare"><svg viewBox="0 0 24 24"><path d="M8 4v16M16 8v12M4 20h16"/></svg><span>Compare</span></button>
    <button data-tab="scan" class="scan-btn" aria-label="Scan a barcode"><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 9v6M10 9v6M13 9v6M17 9v6"/></svg></button>
    <button data-tab="weight"><svg viewBox="0 0 24 24"><path d="M5 20h14l-2-12H7L5 20zM9 8a3 3 0 0 1 6 0"/></svg><span>Weight</span></button>
    <button data-tab="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>More</span></button>
  </nav>
  <div class="sheet-wrap" id="sheetWrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
  <div class="toast" id="toast" hidden></div>
  <script src="config.js"></script>
  <script src="foods.js"></script>
  <script src="syncmodel.js"></script>
  <script src="vendor/html5-qrcode.min.js" defer></script>
  <script src="app.js"></script>
</body>
</html>
