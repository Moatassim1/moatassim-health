<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="GG Gains">
  <meta name="theme-color" content="#F7F2EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#100C0F" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="icons/icon-180.png?v=4">
  <link rel="icon" href="icons/icon-192.png?v=4">
  <link rel="manifest" href="manifest.webmanifest">
  <title>GG Gains</title>
  <link rel="stylesheet" href="styles.css?v=2.0.26">
</head>
<body>
  <div class="auth" id="auth" hidden></div>
  <div class="boot-loading">Loading your data…</div>
  <header class="mtop" id="mtop"></header>
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <img class="brand-mark" src="icons/icon-192.png" alt="">
        <div><div class="brand-name">GG<br>Gains</div><div class="brand-ver" id="brandVer"></div></div>
      </div>
      <div class="profiles" id="profiles"></div>
      <nav class="nav" id="nav">
        <button data-view="today" class="active">Food diary</button>
        <button data-view="trends">Daily Performance</button>
        <button data-view="friends">Friends & ranking</button>
        <button data-view="garmin">Devices</button>
        <button data-view="foods">Food list</button>
        <button data-view="forecast">Weight projection</button>
        <button data-view="settings">Settings</button>
      </nav>
      <button class="side-add" id="sideAdd">Log food</button>
      <div class="side-foot" id="sideFoot"></div>
    </aside>
    <main class="main" id="main"></main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Main">
    <button data-view="today"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Diary</span></button>
    <button data-view="trends"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Performance</span></button>
    <button data-view="scan" class="scan-btn" aria-label="Scan a barcode"><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 9v6M10 9v6M13 9v6M17 9v6"/></svg></button>
    <button data-view="friends"><svg viewBox="0 0 24 24"><path d="M8 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 11a3 3 0 1 0 0-6M18 14c2.4.6 4 2.9 4 6"/></svg><span>Friends</span></button>
    <button data-view="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>More</span></button>
  </nav>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" id="modalCard"></div>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script src="config.js?v=2.0.26"></script>
  <script src="foods.js?v=2.0.26"></script>
  <script src="syncmodel.js?v=2.0.26"></script>
  <script src="charts.js?v=2.0.26"></script>
  <script src="vendor/html5-qrcode.min.js" defer></script>
  <script src="scanner.js?v=2.0.26"></script>
  <script src="api-web.js?v=2.0.26"></script>
  <script>window.MHBoot();</script>
</body>
</html>
